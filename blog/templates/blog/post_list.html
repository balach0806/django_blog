{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{% static 'blog/css/blog.css' %}">
</head>
<body>
        <main class="container">
        <nav class="nav">
            <a href="{% url 'home' %}">Главная</a>
            <a href="{% url 'about' %}">О себе</a>
        </nav>
        
        <h1>{{ page_title }}</h1>
        
        <section class="post-list">
            {% for post in posts %}
                <!-- Условие для добавления класса, если рейтинг больше 3 -->
                <article class="post-card {% if post.rating > 3 %}post-card--featured{% endif %}">
                    {% if post.image %}
                        <img src="{% static 'blog/images/' %}{{ post.image }}" alt="{{ post.title }}">
                    {% else %}
                        <p class="muted">Без иллюстрации</p>
                    {% endif %}
                    
                    <h2>{{ post.title }}</h2>
                    <p class="muted">Автор: {{ post.author }}</p>
                    <p>{{ post.description }}</p>
                </article>
            {% endfor %}
        </section>
    </main>
</body>
</html>
