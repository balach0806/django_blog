{% load static %}
<article class="post-card {% if post.rating > 3 %}post-card--featured{% endif %}">
    
    <button type="button" class="post-card__refresh"
            hx-get="{% url 'post_card_fragment' post_slug=post.slug %}"
            hx-target="#post-body-{{ post.slug }}"
            hx-swap="innerHTML">
    </button>

    <div id="post-body-{{ post.slug }}" class="post-card__body">
        {% if post.image %}
            <img src="{% static 'blog/images/' %}{{ post.image }}" alt="{{ post.title }}">
        {% else %}
            <p class="muted">Без иллюстрации</p>
        {% endif %}
        
        <h2>
            <a href="{% url 'post_detail' post_slug=post.slug %}">{{ post.title }}</a>
        </h2>
        <p class="muted">Автор: {{ post.author }} | {{ post.category.name }}</p>
        <p>{{ post.description }}</p>
    </div>
</article>
