{% load static %}
<article class="post-card {% if post.rating > 3 %}post-card--featured{% endif %}">
    {% if post.image %}
        <img src="{% static 'blog/images/' %}{{ post.image }}" alt="{{ post.title }}">
    {% else %}
        <p class="muted">Без иллюстрации</p>
    {% endif %}
    
    <h2>
        <a href="{% url 'post_detail' post_slug=post.slug %}">{{ post.title }}</a>
    </h2>
    <p class="muted">Автор: {{ post.author }}</p>
    <p>{{ post.description }}</p>
    <a href="{% url 'post_detail' post_slug=post.slug %}">Читать далее</a>
</article>
